name = "srttrail-leads"
main = "js/workers/index.js"
compatibility_date = "2026-04-15"

[vars]
ALLOWED_ORIGIN = "https://srttrail.dev"

[[durable_objects.bindings]]
name = "LEAD_GUARD"
class_name = "LeadSubmissionGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LeadSubmissionGuard"]

